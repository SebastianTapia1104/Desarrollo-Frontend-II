<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function (ubicacion) {
        if (ubicacion.search[1] === "/") {
          var ruta = ubicacion.search
            .slice(1)
            .split("&")
            .map(function (parte) {
              return parte.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", ubicacion.pathname.slice(0, -1) + ruta + ubicacion.hash);
        }
      })(window.location);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Supermercado PFY2202: gestión de inventario con navegación en React Router."
    />
    <meta name="theme-color" content="#1e3f32" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Literata:opsz,wght@7..72,400;7..72,650&display=swap"
      rel="stylesheet"
    />
    <title>Supermercado PFY2202 | Gestión de inventario</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
